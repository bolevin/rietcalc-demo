name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .[build]
      - name: Build the executable
        run: pyinstaller packaging/rietcalc-demo.spec
      - name: Self-test the executable
        shell: cmd
        run: start /wait "" dist\rietcalc-demo.exe --selftest
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\rietcalc-demo.exe -Algorithm SHA256).Hash + "  rietcalc-demo.exe" | Out-File dist\SHA256SUMS.txt -Encoding ascii
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rietcalc-demo.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
